site_name: RedLightMC Wiki
site_url: https://wiki.redlightmc.fun
site_description: Официальная вики Minecraft-сервера RedLightMC
site_author: RedLightMC Team

theme:
  name: material
  language: ru
  favicon: null
  logo: null
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/Krrnkv3Zxz
  # Замените ссылку выше на реальную ссылку-приглашение вашего Discord-сервера
  generator: false

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# ═══════════════════════════════════════════════════════════════
# НАВИГАЦИЯ
# Чтобы добавить новую страницу — просто добавьте строку ниже
# в нужный раздел и создайте .md файл в соответствующей папке
# ═══════════════════════════════════════════════════════════════
nav:
  - Главная: index.md

  - Гайды:
    - Как начать играть: guides/start.md
    - Моды: guides/mods.md
    # Чтобы добавить ещё гайд, скопируйте строку ниже и раскомментируйте:
    # - Название гайда: guides/имя-файла.md

  - Механики:
    - Защита пашни: mechanics/mechanic-1.md
    - Безлимитная наковальня: mechanics/mechanic-2.md
    - Изменённые крафты: mechanics/mechanic-3.md
    - Кастомные порталы: mechanics/mechanic-4.md
    - Режим AFK: mechanics/mechanic-5.md
    - Могилы после смерти: mechanics/mechanic-6.md
    - Картинки на картах: mechanics/mechanic-7.md
    - Кастомные пластинки: mechanics/mechanic-8.md
    - Поводок для игроков: mechanics/mechanic-9.md
    - Защита от мобов: mechanics/mechanic-10.md
    - Поглаживание игроков: mechanics/mechanic-11.md
    - Живая лестница: mechanics/mechanic-12.md
    - Голосовой чат: mechanics/mechanic-13.md
    - Приседание (/sit): mechanics/mechanic-14.md
    - Смена скинов: mechanics/mechanic-15.md
    - Дальняя прорисовка: mechanics/mechanic-16.md
    - Размер персонажа: mechanics/mechanic-17.md
    - Статус измерений: mechanics/mechanic-18.md
    - Быстрые вагонетки: mechanics/mechanic-19.md
    - Зенитные ракеты: mechanics/mechanic-20.md
    - Телепорты: mechanics/mechanic-21.md
    # Чтобы добавить ещё механику, скопируйте строку ниже:
    # - Название механики: mechanics/имя-файла.md

  - Глобальные изменения:
    - Динамическая сложность: global/global-mod-1.md
    - Новая генерация: global/global-mod-2.md
    - Скоро будет йоу: global/global-mod-3.md
    # Чтобы добавить ещё глобальное изменение, скопируйте строку ниже:
    # - Название: global/имя-файла.md

  - Что планируется:
    - Ближайшее обновление: roadmap/update-1.md
    - Следующее обновление: roadmap/update-2.md
    - Долгосрочные планы: roadmap/update-3.md
    # Чтобы добавить ещё обновление, скопируйте строку ниже:
    # - Название обновы: roadmap/имя-файла.md
